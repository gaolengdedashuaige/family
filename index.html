<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>动物大家庭日历 🦘🐶🐱</title>
<style>
  :root {
    --paper: #FFF7F0; --card: #FFFFFF; --ink: #5C4B40; --ink-soft: #A38C7D;
    --line: #F5E1D4; --line-strong: #E6CBB8; --primary: #FF8E5E;
    --home: #5EC9A1; --away: #FF7B7B; --money: #FFAA33; --shout: #52B5F7;
    --med: #A366FF; --bp: #FF6B8B; --low: #52B5F7; --normal: #5EC9A1; --high: #FF7B7B;
    --shadow: 0 4px 14px rgba(255, 142, 94, 0.1), 0 10px 28px rgba(92, 75, 64, 0.05); --r: 20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.5;padding:16px 12px 90px;}
  .wrap{max-width:900px;margin:0 auto;position:relative;}
  .hidden{display:none!important;}
  .login{max-width:360px;margin:8vh auto 0;background:var(--card);border:2px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:36px 26px;text-align:center;}
  .login .icon{font-size:48px;margin-bottom:10px;display:flex;justify-content:center;gap:8px;}
  .avatar-upload{width:86px;height:86px;border-radius:50%;background:var(--paper);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative;border:3px dashed var(--primary);}
  .avatar-upload img{width:100%;height:100%;object-fit:cover;}
  .avatar-upload span{font-size:12px;color:var(--primary);position:absolute;font-weight:bold;}
  .login h1{font-size:24px;margin:8px 0 2px;color:var(--primary);}
  .login p{color:var(--ink-soft);font-size:13px;margin:0 0 24px;}
  .login input{width:100%;padding:14px;border:2px solid var(--line);border-radius:14px;font-size:16px;margin-bottom:12px;background:var(--paper);font-family:inherit;color:var(--ink);text-align:center;}
  .login input:focus{outline:none;border-color:var(--primary);background:#fff;}
  .login button{width:100%;padding:14px;border:none;border-radius:14px;background:var(--primary);color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:6px;}
  .login .err{color:var(--away);font-size:13px;min-height:18px;margin-top:10px;font-weight:bold;}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .user-badge{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;color:var(--primary);background:var(--card);padding:4px 12px 4px 4px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
  .user-badge img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--primary);}
  .top .out{border:none;background:var(--line);color:var(--ink-soft);border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:800;}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .brand .logo{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg, #FFAD80, var(--primary));display:grid;place-items:center;font-size:26px;}
  .brand h1{font-size:22px;margin:0;font-weight:800;color:var(--ink);}
  .brand .sub{font-size:12px;letter-spacing:1px;color:var(--ink-soft);text-transform:uppercase;font-weight:bold;}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-bottom:16px;align-items:center;background:var(--card);padding:10px 14px;border-radius:14px;}
  .legend span{display:inline-flex;align-items:center;gap:4px;font-weight:600;}
  .swatch{width:12px;height:12px;border-radius:50%;display:inline-block;}
  .monthbar{text-align:center;position:relative;margin:12px 0 16px;display:flex;justify-content:space-between;align-items:center;}
  .monthbar .nav{width:40px;height:40px;border-radius:50%;border:none;background:var(--card);cursor:pointer;font-size:18px;color:var(--primary);font-weight:bold;}
  .monthbar .title-box{flex:1;}
  .monthbar .title{font-size:22px;font-weight:900;color:var(--ink);}
  .monthbar .today-link{font-size:13px;color:var(--primary);cursor:pointer;margin-top:4px;font-weight:bold;}
  .cal{background:var(--card);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px;}
  .weekrow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;padding:6px 0 10px;color:var(--ink-soft);font-size:13px;font-weight:800;border-bottom:2px dashed var(--line);}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);}
  .cell{min-height:82px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;cursor:pointer;position:relative;}
  .cell:nth-child(7n){border-right:none;}
  .cell.blank{cursor:default;background:repeating-linear-gradient(-45deg,transparent,transparent 8px,rgba(255, 142, 94,0.03) 8px,rgba(255, 142, 94,0.03) 16px);}
  .cell:not(.blank):hover{background:#FFFBF8;}
  .cell .d{font-size:14px;color:var(--ink-soft);font-weight:800;}
  .cell.today{box-shadow:inset 0 0 0 3px var(--primary);border-radius:12px;}
  .cell.today .d{color:var(--primary);font-weight:900;font-size:16px;}
  .tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}
  .tag{font-size:10px;padding:2px 5px;border-radius:6px;color:#fff;font-weight:bold;}
  .tag.glu{background:var(--primary);}
  .tag.money{background:var(--money);}
  .tag.memo{background:var(--ink-soft);}
  .tag.med{background:var(--med);}
  .tag.bp{background:var(--bp);}
  .cell .dinner{position:absolute;right:4px;bottom:4px;font-size:14px;}
  .summary-card, .shout-card{margin-top:24px;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);}
  .summary-card h3, .shout-card h3{margin:0 0 16px;font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px;color:var(--ink);}
  .sum-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:14px;}
  .sum-item{background:var(--paper);padding:14px;border-radius:14px;border:1px solid var(--line);}
  .sum-item .label{font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:bold;}
  .sum-item .val{font-size:20px;font-weight:900;color:var(--ink);}
  .shout-list{max-height:260px;overflow-y:auto;padding-right:6px;margin-bottom:16px;display:flex;flex-direction:column;gap:14px;}
  .shout-item{display:flex;gap:10px;align-items:flex-end;}
  .shout-item img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--line-strong);flex-shrink:0;}
  .shout-item .content{background:var(--paper);padding:10px 14px;border-radius:16px 16px 16px 4px;max-width:85%;border:1px solid var(--line);}
  .shout-item.mine{flex-direction:row-reverse;}
  .shout-item.mine .content{background:#FFEBE1;border-color:#FFD2BD;border-radius:16px 16px 4px 16px;}
  .shout-item .meta{font-size:11px;color:var(--ink-soft);margin-bottom:4px;font-weight:bold;}
  .shout-item .text{font-size:15px;color:var(--ink);word-break:break-word;font-weight:500;}
  .shout-input-box{display:flex;gap:10px;background:var(--paper);padding:6px;border-radius:16px;border:1px solid var(--line);}
  .shout-input-box input{flex:1;margin:0;padding:12px;border:none;border-radius:12px;font-size:15px;background:transparent;color:var(--ink);}
  .shout-input-box input:focus{outline:none;}
  .shout-input-box button{background:var(--shout);color:#fff;border:none;padding:0 20px;border-radius:12px;font-weight:800;cursor:pointer;}
  .overlay{position:fixed;inset:0;background:rgba(92, 75, 64, 0.6);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .overlay.show{display:flex;}
  .modal{background:var(--paper);border-radius:24px 24px 0 0;width:100%;max-width:500px;max-height:92vh;display:flex;flex-direction:column;}
  @media(min-width:560px){.overlay{align-items:center;padding:20px;}.modal{border-radius:24px;}}
  .modal .head{background:var(--card);padding:20px 24px 16px;border-radius:24px 24px 0 0;display:flex;justify-content:space-between;align-items:center;}
  .modal .head .dt{font-size:20px;font-weight:900;color:var(--primary);}
  .modal .head .wd{font-size:13px;color:var(--ink-soft);font-weight:bold;margin-top:2px;}
  .modal .head .x{cursor:pointer;font-size:28px;color:var(--ink-soft);line-height:1;background:var(--paper);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;}
  .modal .body{padding:20px 24px;overflow-y:auto;background:var(--paper);}
  .sec{margin-bottom:28px;background:var(--card);padding:16px;border-radius:20px;border:1px solid var(--line);}
  .sec h4{font-size:16px;margin:0 0 14px;display:flex;align-items:center;gap:8px;font-weight:900;color:var(--ink);}
  .list-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px dotted var(--line);font-size:14px;}
  .list-item:last-of-type{border-bottom:none;}
  .list-item .meta{color:var(--ink-soft);font-size:12px;flex:1;line-height:1.5;}
  .list-item .meta strong{color:var(--ink);font-size:14px;font-weight:800;}
  .list-item .kill{cursor:pointer;color:var(--away);background:#FFEBE1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:bold;}
  .empty{color:var(--ink-soft);font-size:14px;padding:10px 0;text-align:center;font-weight:bold;}
  label{display:block;font-size:13px;color:var(--ink-soft);font-weight:800;margin:12px 0 8px;}
  input[type=text],input[type=number],input[type=time],select{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:15px;background:var(--paper);font-family:inherit;color:var(--ink);font-weight:bold;}
  input:focus,select:focus{outline:none;border-color:var(--primary);background:#fff;}
  .row{display:flex;gap:10px;}
  .row>*{flex:1;}
  .btn-group{display:flex;gap:10px;margin-top:14px;}
  .btn-group button{flex:1;padding:12px;border-radius:12px;border:2px solid var(--line);font-size:14px;font-weight:900;cursor:pointer;background:var(--card);color:var(--ink-soft);}
  .btn-group button.active.green{background:#E2F7ED;border-color:var(--home);color:var(--home);}
  .btn-group button.active.red{background:#FFEBE1;border-color:var(--away);color:var(--away);}
  .addbtn{width:100%;margin-top:16px;background:var(--primary);color:#fff;border:none;padding:14px;border-radius:14px;font-size:16px;font-weight:900;cursor:pointer;}
  .addbtn.money{background:var(--money);}
  .addbtn.memo{background:var(--ink);}
  .addbtn.med{background:var(--med);}
  .addbtn.bp{background:var(--bp);}
  .deco-animals{position:fixed;bottom:20px;right:20px;font-size:38px;z-index:10;pointer-events:none;display:flex;gap:8px;}
</style>
</head>
<body>

<div id="loginScreen" class="login">
  <div class="icon">🦘 🐶 🐱</div>
  <h1>动物大家庭日历</h1>
  <p>袋鼠、狗狗和猫猫的温馨小窝</p>
  
  <label for="avatarInput">
    <div class="avatar-upload" id="avatarPreview">
      <span>点此传头像</span>
    </div>
  </label>
  <input type="file" id="avatarInput" accept="image/*" class="hidden">
  
  <input id="who" type="text" placeholder="你的名字（如 妈妈）" autocomplete="off">
  <input id="password" type="password" placeholder="空间密码">
  <button id="loginBtn">蹦进去！</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="appScreen" class="wrap hidden">
  <div class="deco-animals">🦘 🐶 🐱</div>
  <div class="top">
    <div class="user-badge" id="whoami"></div>
    <button class="out" id="logoutBtn">退出</button>
  </div>
  <div class="brand">
    <div class="logo">🦘</div>
    <div><h1>动物大家庭口袋</h1><div class="sub">Animal Family</div></div>
  </div>
  <div class="legend">
    <span><i class="swatch" style="background:var(--normal)"></i>正常</span>
    <span><i class="swatch" style="background:var(--high)"></i>异常</span>
    <span>💰 消费</span>
    <span>📝 备忘</span>
    <span>💊 吃药</span>
    <span>🫀 血压</span>
    <span>🍚 回家吃</span>
  </div>
  <div class="monthbar">
    <button class="nav prev" id="prevM">‹</button>
    <div class="title-box">
      <div class="title" id="monthTitle">—</div>
      <div class="today-link" id="todayLink">🐾 蹦回今天</div>
    </div>
    <button class="nav next" id="nextM">›</button>
  </div>
  <div class="cal">
    <div class="weekrow"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="summary-card">
    <h3 id="sumTitle">口袋汇总 👝</h3>
    <div class="sum-grid" id="summaryGrid"></div>
  </div>
  <div class="shout-card">
    <h3>📢 家庭大喇叭</h3>
    <div class="shout-list" id="shoutList"></div>
    <div class="shout-input-box">
      <input id="shoutInput" type="text" placeholder="想对全家喊点什么？" autocomplete="off">
      <button id="shoutBtn">发送</button>
    </div>
  </div>
</div>

<div class="overlay" id="dayOverlay">
  <div class="modal">
    <div class="head">
      <div><div class="dt" id="dayTitle">—</div><div class="wd" id="dayWeekday"></div></div>
      <div class="x" id="dayClose">×</div>
    </div>
    <div class="body">
      <div class="sec">
        <h4>📝 备忘录与行程</h4>
        <div id="memoList"></div>
        <div class="row" style="margin-top:12px;">
          <input id="mText" style="flex:3" type="text" placeholder="比如：带妈妈复查">
          <button class="addbtn memo" style="flex:1; margin-top:0;" id="mAdd">记下</button>
        </div>
      </div>
      <div class="sec">
        <h4>🏠 吃饭与打卡</h4>
        <div id="punchList" style="margin-bottom:12px;"></div>
        <div class="btn-group">
          <button id="dHome" class="green">🍚 回家吃</button>
          <button id="dAway" class="red">🚫 不回来</button>
          <button id="pAdd">📍 刚刚到家</button>
        </div>
      </div>
      <div class="sec">
        <h4>💰 口袋开销</h4>
        <div id="expenseList"></div>
        <div class="row" style="margin-top:12px;">
          <select id="eCur" style="flex:0.8; padding:12px 6px;">
            <option value="¥">¥ 人民币</option><option value="NT$">NT$ 台币</option><option value="$">$ 美元</option><option value="€">€ 欧元</option><option value="£">£ 英镑</option>
          </select>
          <input id="eVal" style="flex:1.2" type="number" inputmode="decimal" placeholder="金额">
          <input id="eNote" style="flex:1.5" type="text" placeholder="买菜">
        </div>
        <button class="addbtn money" id="eAdd">＋ 记一笔开销</button>
      </div>
      <div class="sec">
        <h4>💊 吃药打卡</h4>
        <div id="medList"></div>
        <div class="row" style="margin-top:12px;">
          <input id="medName" style="flex:2" type="text" placeholder="药名 (如降压药)">
          <input id="medTime" style="flex:1" type="time">
        </div>
        <button class="addbtn med" id="medAdd">＋ 记录吃药</button>
      </div>
      <div class="sec">
        <h4>🫀 血压记录</h4>
        <div id="bpList"></div>
        <div class="row" style="margin-top:12px;">
          <div><label>高压(收缩压)</label><input id="bpHigh" type="number" placeholder="120"></div>
          <div><label>低压(舒张压)</label><input id="bpLow" type="number" placeholder="80"></div>
          <div><label>时间</label><input id="bpTime" type="time"></div>
        </div>
        <button class="addbtn bp" id="bpAdd">＋ 记一条血压</button>
      </div>
      <div class="sec" style="margin-bottom:0;">
        <h4>🩸 血糖记录</h4>
        <div id="gluList"></div>
        <div class="row" style="margin-top:12px;">
          <div><label>数值</label><input id="gVal" type="number" inputmode="decimal" step="0.1" placeholder="6.5"></div>
          <div><label>时段</label><option>空腹</option><option>餐前</option><option>餐后</option><option>睡前</option><option>随机</option></div>
          <div><label>时间</label><input id="gTime" type="time"></div>
        </div>
        <input id="gNote" type="text" placeholder="备注（可选）" style="margin-top:10px;">
        <button class="addbtn" id="gAdd">＋ 记一条血糖</button>
      </div>
    </div>
  </div>
</div>

<script>
const PASSWORD = "zp610852";
const $ = id => document.getElementById(id);
const WD = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];

let view = { y: new Date().getFullYear(), m: new Date().getMonth() };
let openDate = null;
let myName = localStorage.getItem("familyName") || "";
let myAvatar = localStorage.getItem("familyAvatar") || "";

$("who").value = myName;
if(myAvatar) $("avatarPreview").innerHTML = `<img src="${myAvatar}">`;

$("avatarInput").onchange = (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    myAvatar = ev.target.result;
    $("avatarPreview").innerHTML = `<img src="${myAvatar}">`;
  };
  reader.readAsDataURL(file);
};

// 极速免登录验证（直接进入本地模拟模式，不卡网络）
$("loginBtn").onclick = () => {
  if($("password").value !== PASSWORD) { 
    $("loginErr").textContent = "密码不对哦，狗狗不让你进！🦴"; 
    return; 
  }
  myName = $("who").value.trim() || "家人";
  localStorage.setItem("familyName", myName);
  localStorage.setItem("familyUnlocked", "1");
  if(myAvatar) localStorage.setItem("familyAvatar", myAvatar);
  enter();
};

$("password").addEventListener("keydown",e=>{ if(e.key==="Enter") $("loginBtn").click(); });
$("logoutBtn").onclick = () => { localStorage.clear(); location.reload(); };

if(localStorage.getItem("familyUnlocked") === "1") {
  enter();
}

function enter() {
  $("loginScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");
  let badgeHtml = "";
  if(myAvatar) badgeHtml += `<img src="${myAvatar}">`;
  else badgeHtml += `<span>🐶</span>`;
  badgeHtml += `<span>${myName}</span>`;
  $("whoami").innerHTML = badgeHtml;
  renderGrid();
  renderSummary();
}

$("prevM").onclick=()=>{ view.m--; if(view.m<0){view.m=11;view.y--;} renderGrid(); renderSummary(); };
$("nextM").onclick=()=>{ view.m++; if(view.m>11){view.m=0;view.y++;} renderGrid(); renderSummary(); };
$("todayLink").onclick=()=>{ const n=new Date(); view={y:n.getFullYear(),m:n.getMonth()}; renderGrid(); renderSummary(); };

function renderGrid() {
  $("monthTitle").textContent = `${view.y}年${view.m+1}月`;
  const grid = $("grid"); grid.innerHTML = "";
  const first = new Date(view.y, view.m, 1); 
  let lead = (first.getDay() + 6) % 7; 
  const days = new Date(view.y, view.m + 1, 0).getDate(); 
  const now = new Date();
  
  for(let i=0; i<lead; i++) { 
    const b = document.createElement("div"); b.className="cell blank"; grid.appendChild(b); 
  }
  
  for(let d=1; d<=days; d++) {
    const cell = document.createElement("div"); cell.className = "cell";
    if(now.getFullYear()===view.y && now.getMonth()===view.m && now.getDate()===d) cell.classList.add("today");
    cell.innerHTML = `<div class="d">${d}</div>`;
    cell.onclick = () => openDay(view.y, view.m, d);
    grid.appendChild(cell);
  }
}

function openDay(y, m, d) {
  openDate = `${y}-${m}-${d}`;
  $("dayTitle").textContent = `${m+1}月${d}日`;
  $("dayWeekday").textContent = WD[new Date(y, m, d).getDay()];
  $("dayOverlay").classList.add("show");
}

$("dayClose").onclick = () => { $("dayOverlay").classList.remove("show"); };
$("dayOverlay").onclick = e => { if(e.target === $("dayOverlay")){ $("dayOverlay").classList.remove("show"); } };

function renderSummary() {
  $("sumTitle").innerHTML = `${view.m+1}月 汇总 👝`;
  $("summaryGrid").innerHTML = `<div style="font-size:14px;color:var(--ink-soft);text-align:center;padding:10px;">🐾 欢迎来到多多的温暖小窝！</div>`;
}
</script>
</body>
</html>
